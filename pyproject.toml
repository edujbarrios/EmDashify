[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emdashify"
version = "0.3.0"
description = "Convert double hyphens into em dashes in Python, Markdown, and Word documents. No AI required."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause-Attribution"
license-files = ["LICENSE"]
authors = [{ name = "edujbarrios" }]
keywords = ["em dash", "typography", "text", "markdown", "cli", "unicode", "ai writing", "word document", "docx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]

[project.optional-dependencies]
word = ["python-docx>=1.2.0,<2"]

[project.urls]
Homepage = "https://github.com/edujbarrios/EmDashify"
Repository = "https://github.com/edujbarrios/EmDashify"
Issues = "https://github.com/edujbarrios/EmDashify/issues"

[project.scripts]
emdashify = "emdashify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emdashify = ["py.typed"]
