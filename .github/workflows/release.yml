name: Publish to PyPI

on:
  release:
    types: [published]
  # One-time 0.2.0 publishing trigger; remove after a successful upload.
  create:

permissions: {}

jobs:
  build:
    name: Test and build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Run tests
        run: |
          python -m pip install -e ".[word]"
          python -m unittest discover -s tests -v
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event_name == 'create' && github.event.ref || github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          from emdashify import __version__
          project = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          version = project['project']['version']
          tag = os.environ['RELEASE_TAG'].removeprefix('publish/')
          assert tag == f'v{version}', f'Tag {tag!r} does not match v{version}'
          assert version == __version__, 'pyproject.toml and package __version__ differ'
          PY
      - name: Build and verify distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c 'from emdashify import convert; assert convert("Hello -- world") == "Hello — world"'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
