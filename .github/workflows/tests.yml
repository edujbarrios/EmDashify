name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install editable package
        run: python -m pip install -e ".[word]"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Verify entry point
        run: emdashify --version

  package:
    name: Build, validate, and install PyPI artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Install the built wheel in a clean environment
        run: |
          python -m venv /tmp/emdashify-smoke
          /tmp/emdashify-smoke/bin/python -m pip install "dist/"*.whl
          cd /tmp
          /tmp/emdashify-smoke/bin/emdashify --version
          /tmp/emdashify-smoke/bin/python -c 'from emdashify import convert; assert convert("Hello -- world") == "Hello—world"'
      - name: Verify the optional Word extra from the wheel
        run: |
          /tmp/emdashify-smoke/bin/python -m pip install "dist/"*.whl"[word]"
          cd /tmp
          /tmp/emdashify-smoke/bin/python -c 'from emdashify import convert_docx, check_docx; import docx; assert callable(convert_docx) and callable(check_docx)'
